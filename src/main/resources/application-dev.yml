# =============================================================================
# Development profile: safe local defaults, no real secrets required.
# =============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/demo_db}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo123}
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  security:
    # Cho phép gọi API không cần JWT khi chạy local. Bật lại bằng biến môi trường.
    public-api: ${SECURITY_PUBLIC_API:true}
    user: ${APP_SECURITY_USER:admin}
    password: ${APP_SECURITY_PASSWORD:admin123}
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
      expiration: ${JWT_EXPIRATION:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
