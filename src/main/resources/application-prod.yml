# =============================================================================
# Production profile: fail fast when a secret is missing; API docs disabled.
# =============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  forward-headers-strategy: framework

app:
  security:
    public-api: false
    user: ${APP_SECURITY_USER}
    password: ${APP_SECURITY_PASSWORD}
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.example.demo: INFO
