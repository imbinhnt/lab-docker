apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "java-web-demo.fullname" . }}-config
  labels:
    {{- include "java-web-demo.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  DB_URL: {{ .Values.config.dbUrl | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  JWT_EXPIRATION: {{ .Values.config.jwtExpiration | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  SPRINGDOC_ENABLED: {{ .Values.config.springdocEnabled | quote }}
