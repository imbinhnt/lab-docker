{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "java-web-demo.secretName" . }}
  labels:
    {{- include "java-web-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secret.dbPassword is required (or set secret.existingSecret)" .Values.secret.dbPassword | quote }}
  JWT_SECRET: {{ required "secret.jwtSecret is required (or set secret.existingSecret)" .Values.secret.jwtSecret | quote }}
  APP_SECURITY_USER: {{ .Values.secret.adminUser | quote }}
  APP_SECURITY_PASSWORD: {{ required "secret.adminPassword is required (or set secret.existingSecret)" .Values.secret.adminPassword | quote }}
{{- end }}
