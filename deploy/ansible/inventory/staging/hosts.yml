---
all:
  children:
    staging:
      hosts:
        staging-1:
          ansible_host: "{{ lookup('env', 'STAGING_HOST') | default('staging.example.com', true) }}"
          ansible_user: "{{ lookup('env', 'STAGING_USER') | default('ubuntu', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'STAGING_SSH_KEY') | default('~/.ssh/id_ed25519', true) }}"
