---
all:
  children:
    prod:
      hosts:
        prod-1:
          ansible_host: "{{ lookup('env', 'PROD_HOST') | default('prod.example.com', true) }}"
          ansible_user: "{{ lookup('env', 'PROD_USER') | default('ubuntu', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROD_SSH_KEY') | default('~/.ssh/id_ed25519', true) }}"
